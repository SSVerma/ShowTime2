name: ShowTime CI

on:
  push:
    branches:
      - main
      - development
      - 'release/**'
  pull_request:
    branches:
      - main
      - development
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

      - name: Setup Build Configuration & Mock Secrets
        run: |
          # 1. Provide mock debug.properties if missing
          if [ ! -f "debug.properties" ]; then
            echo 'baseUrl="https://api.themoviedb.org/"' > debug.properties
          fi

          # 2. Provide mock core.properties if missing
          if [ ! -f "core.properties" ]; then
            echo 'tmdbApiReadAccessToken="ci_mock_tmdb_token"' > core.properties
            echo 'traktClientId="ci_mock_trakt_id"' >> core.properties
          fi

          # 3. Provide mock release.properties if missing
          mkdir -p release
          if [ ! -f "release/release.properties" ]; then
            echo 'baseUrl="https://api.themoviedb.org/"' > release/release.properties
            echo 'keyAlias="mock"' >> release/release.properties
            echo 'keyPassword="mock"' >> release/release.properties
            echo 'keyStoreFilePath="mock.jks"' >> release/release.properties
            echo 'keyStorePassword="mock"' >> release/release.properties
          fi

          # 4. Provide mock google-services.json for debug builds if missing
          mkdir -p app/src/debug
          if [ ! -f "app/src/debug/google-services.json" ]; then
            cat << 'EOF' > app/src/debug/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "showtime-mock",
              "storage_bucket": "showtime-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:mockappid",
                  "android_client_info": {
                    "package_name": "com.ssverma.showtime.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --no-daemon --stacktrace

      - name: Publish Test Report & PR Annotations
        uses: mikepenz/action-junit-report@v4
        if: always() # Run even if tests fail so results are reported
        with:
          report_paths: '**/build/test-results/test*UnitTest/*.xml'
          check_name: 'Unit Test Results'
          fail_on_failure: false
          require_tests: true
          detailed_summary: true

      - name: Upload Test Report Artifacts (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
